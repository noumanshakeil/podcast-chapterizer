[project]
name = "podcast-chapterizer"
version = "2.0.0"
description = "Turn episode transcripts into timestamped chapters and exportable TOC for show notes."
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
